schema_version: schema_v001
xsi_geometry_version: xsi_geometry_v001
status: human_confirmed_geometry_sign

xsi_geometry:
  reference_receiver_index: 7
  receiver_count: 13
  receiver_spacing_ft: 0.5
  r1_source_distance_ft: 1.0
  side_a_aligned_to_cast_zero_deg: true
  side_order: clockwise
  depth_axis_sign: -1
  sign_convention_status: human_confirmed
  depth_increases_toward: deeper
  sample_index_direction: deep_to_shallow
  receiver_index_direction: R1_deep_to_R13_shallow
  source_position: deeper_than_R1
  geometry_sign_note: >
    Human tool-geometry confirmation fixed depth_axis_sign=-1 because the
    stored schema offsets use source=-4 ft, R1=-3 ft, and R13=+3 ft relative
    to R7 while measured depth increases toward deeper. This is independent
    of RelBearing plus/minus azimuth rotation.
  receiver_offsets_relative_to_r7_ft:
    R1: -3.0
    R2: -2.5
    R3: -2.0
    R4: -1.5
    R5: -1.0
    R6: -0.5
    R7: 0.0
    R8: 0.5
    R9: 1.0
    R10: 1.5
    R11: 2.0
    R12: 2.5
    R13: 3.0
  source_offset_relative_to_r7_ft: -4.0
  alignment_modes:
    - r7_reference_depth
    - receiver_depth_shifted
    - source_receiver_midpoint
    - source_receiver_interval

side_geometry:
  side_count: 8
  side_labels:
    - A
    - B
    - C
    - D
    - E
    - F
    - G
    - H
  side_a_aligned_with_cast_0deg: true
  side_a_offset_deg: 0.0
  side_a_offset_status: manually_confirmed
  xsi_side_order: clockwise
  xsi_side_order_status: manually_confirmed

cast_azimuth:
  cast_azimuth_direction: normal
  cast_azimuth_direction_status: manually_confirmed
  column_1_deg: 0.0
  column_2_deg: 2.0
  last_column_deg: 358.0
  azimuth_count: 180
  azimuth_step_deg: 2.0
  cast_azimuth_values: 0,2,4,...,358

relbearing_convention:
  relbearing_sign_status: specification_preferred_plus_data_unresolved
  primary_convention: plus
  ablation_convention: minus
  formula: theta_aligned = (theta_raw + RelBearing) mod 360
  data_driven_validation: insufficient_evidence
  single_sign_alignment_approved: false
  approved_downstream_mode: plus_primary_minus_ablation
  relation_to_depth_axis_sign: independent

guardrails:
  label_status: weak_label_candidate
  no_final_labels: true
  no_model_training: true
  no_stc: true
  no_apes: true
  no_deep_learning: true
  no_mvp4c: true
